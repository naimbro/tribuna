<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIBUNA — mis partidas</title>
<style>
:root{--bg:#070a0e;--panel:#0e141b;--panel2:#131b24;--line:#1e2a36;--txt:#e6edf3;--dim:#7d8fa1;--dim2:#4d5f70;
  --neon:#00e07a;--amber:#ffb020;--A:#38bdf8;--B:#fb7185;--P:#a78bfa;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#10202b 0%,transparent 60%),var(--bg)}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
header b{color:var(--neon);letter-spacing:.3em;font-size:18px}
header .t{color:var(--dim)}
header .yo{margin-left:auto;color:var(--dim);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--dim2)}
.btn.pri{background:var(--neon);color:#052a16;border-color:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit}
.curso{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
.curso-cab{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#10202b,transparent)}
.curso-cab h2{margin:0;font-size:18px}
.curso-cab .cifras{display:flex;gap:18px;color:var(--dim);font-size:13px}
.curso-cab .cifras b{color:var(--txt);font-size:16px}
.curso-cab .nueva{margin-left:auto;display:flex;gap:8px}
.partida{border-bottom:1px solid var(--line)}
.partida:last-child{border-bottom:none}
.fila{display:grid;grid-template-columns:92px 64px 1fr 150px 120px 110px auto;gap:12px;align-items:center;padding:11px 18px;cursor:pointer}
.fila:hover{background:#0f1820}
.fila .f{color:var(--dim);font-size:12.5px}
.cod{font-family:var(--mono);color:var(--neon);letter-spacing:.14em;font-weight:700}
.tema{min-width:0}.tema div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tema small{color:var(--dim)}
.estado{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;justify-self:start}
.estado.vivo{border-color:var(--neon);color:var(--neon)}
.estado.fin{border-color:var(--amber);color:var(--amber)}
.gana{font-weight:700;font-size:13px}
.gente{font-size:12.5px;color:var(--dim)}
.gente i{font-style:normal}
.fbm{font-size:13px}
.fbm b{font-size:16px}
.detalle{display:none;padding:4px 18px 20px;background:#0b1117}
.partida.abierta .detalle{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.caja h3{margin:0 0 10px;font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:600}
.com{padding:8px 10px;border-radius:9px;background:var(--panel2);margin-bottom:6px}
.com .q{font-size:12.5px;display:flex;gap:8px;align-items:center}
.com p{margin:3px 0 0;color:#c9d4de;white-space:pre-wrap}
.jug{display:flex;flex-wrap:wrap;gap:10px}
.jug div{display:flex;align-items:center;gap:7px;font-size:12.5px;background:var(--panel2);border-radius:99px;padding:3px 10px 3px 3px}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);overflow:hidden;display:grid;place-items:center;background:#16212c;font-size:10px;font-weight:800;color:var(--c)}
.av img{width:100%;height:100%;object-fit:cover}
.marc{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.marc div{flex:1;min-width:120px;background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--dim)}
.marc b{display:block;font-size:14px;color:var(--txt)}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.vacio,.aviso{color:var(--dim);text-align:center;padding:40px 10px}
.entrar{max-width:420px;margin:12vh auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}
.barra{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.barra h1{margin:0;font-size:22px;margin-right:auto}
label.chk{color:var(--dim);font-size:13px;display:flex;gap:6px;align-items:center}
.caja .mapa{width:360px;max-width:100%;height:auto;flex:none}
.tl-ley,.tl-sum{color:var(--dim);font-size:12px;margin:-4px 0 10px}
.tl-sum b{color:#f43f5e;font-size:15px}
.tl-grid{border-collapse:collapse;width:100%}
.tl-grid th{text-align:left;font-weight:600;font-size:12.5px;white-space:nowrap;padding:3px 12px 3px 0;width:1%}
.tl-grid th small{color:var(--dim);font-weight:400}
.tl-grid td{padding:3px 0}
.tl-c{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 3px;margin:0 5px 3px 0;cursor:pointer;line-height:0}
.tl-c:hover,.tl-c.on{border-color:var(--dim)}
.tl-c{position:relative}.tl-mic{position:absolute;right:-5px;top:-7px;font-size:11px;line-height:1}
.tl-det:not(:empty){margin-top:12px;background:var(--panel2);border-radius:10px;padding:12px 14px}
.tl-dc{font-size:13px;margin-bottom:6px}
.tl-big{width:100%;max-width:560px;height:auto;display:block;margin:10px 0}
.tl-det ul{margin:6px 0;padding-left:18px;color:#c9d4de;font-size:13px}
.tl-tx{color:#c9d4de;font-style:italic;font-size:13px;margin:8px 0;white-space:pre-wrap}
.tl-pie{color:var(--dim);font-size:11.5px;margin:8px 0 0}
@media (max-width:820px){
  .fila{grid-template-columns:70px 1fr auto;row-gap:4px}
  .fila .f,.fila .gente,.fila .fbm{grid-column:span 1}
  .cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><b>TRIBUNA</b><span class="t">Panel del profesor</span><span class="yo" id="yo"></span></header>
<main id="main"><div class="aviso">Cargando…</div></main>
<script src="contenido/sesiones.js?v=20260921a"></script>
<script src="telemetria.js?v=20260925b"></script>
<script src="rotacion.js?v=20260926p"></script>
<script src="brujula.js?v=20260926p"></script>
<script type="module" src="admin.js?v=20260926p"></script>
</body>
</html>
