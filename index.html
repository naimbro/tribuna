<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Sin sala ni semana, la dirección del juego abre el panel del profesor (como ml2).
  // La pantalla del profesor se abre desde ahí: «＋ Nueva partida» o «▶ Abrir pantalla».
  if (!location.search) location.replace("admin.html");
</script>
<title>TRIBUNA — prototipo</title>
<style>
:root{
  --bg:#070a0e; --panel:#0e141b; --panel2:#131b24; --line:#1e2a36;
  --txt:#e6edf3; --dim:#7d8fa1; --dim2:#4d5f70;
  --neon:#00e07a; --amber:#ffb020; --hot:#f43f5e;
  --A:#38bdf8; --B:#fb7185;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 50% -10%, #10202b 0%, transparent 60%),
    var(--bg);
  color:var(--txt);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- marquesina superior ---------- */
header{
  display:flex;align-items:center;gap:18px;padding:10px 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d151d,#0a1016);
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{
  font-family:var(--mono);font-size:21px;letter-spacing:.22em;color:var(--neon);
  text-shadow:0 0 18px rgba(0,224,122,.55);
}
.brand span{font-size:10px;color:var(--dim2);letter-spacing:.18em}
.mocion{flex:1;min-width:0}
.mocion .k{font-size:9.5px;letter-spacing:.2em;color:var(--amber)}
.mocion .v{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reloj{
  font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;
  padding:2px 14px;border:1px solid var(--line);border-radius:8px;background:#0a1016;min-width:118px;text-align:center;
}
.reloj.corriendo{color:var(--neon);border-color:rgba(0,224,122,.45);box-shadow:0 0 22px rgba(0,224,122,.14) inset}
.reloj.urgente{color:var(--hot);border-color:rgba(244,63,94,.5);animation:pulso .9s infinite}
@keyframes pulso{50%{opacity:.45}}
.ronda-pill{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:6px 12px;
  border:1px solid var(--line);border-radius:999px;color:var(--amber);background:#0a1016;white-space:nowrap;
}

/* ---------- marcador ----------
   En espejo y centrado: los nombres hacia afuera, las cifras hacia el centro, y las del PÚBLICO
   pegadas a la barra del centro (que también es del público). Así los dos lados se comparan de un
   vistazo. El ancho está acotado: en una pantalla ancha no se separan. */
.marcador{
  display:grid;grid-template-columns:minmax(0,520px) 230px minmax(0,520px);justify-content:center;
  gap:0;align-items:stretch;padding:9px 18px;border-bottom:1px solid var(--line);background:#0a1016;
}
.eq{
  display:flex;align-items:center;gap:6px;padding:7px 12px;position:relative;overflow:hidden;
  border:1px solid var(--line);background:var(--panel);
}
#eqA{justify-content:flex-end;border-radius:12px 0 0 12px;border-right:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--A) 14%,var(--panel)) 0%,var(--panel) 55%)}
#eqB{justify-content:flex-start;border-radius:0 12px 12px 0;border-left:none;
  background:linear-gradient(270deg,color-mix(in srgb,var(--B) 14%,var(--panel)) 0%,var(--panel) 55%)}
.eq::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--c)}
#eqA::before{left:0} #eqB::before{right:0}
.eq .flag{font-size:20px}
.eq .id{min-width:0;flex:0 1 auto;margin:0 8px}
#eqA .id{text-align:right}
.eq .id b{display:block;font-size:14px;letter-spacing:.12em;color:var(--c);white-space:nowrap}
.eq .id small{display:block;color:var(--dim2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* orden en espejo: A = nombre, bandera, jurado, público | centro | B = público, jurado, bandera, nombre */
#eqA .id{order:1} #eqA .flag{order:2} #eqA .rigor{order:3} #eqA .publico{order:4}
#eqB .publico{order:1} #eqB .rigor{order:2} #eqB .flag{order:3} #eqB .id{order:4}
.cifra{text-align:center;min-width:70px;padding:2px 4px}
.cifra .n{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1}
.cifra .l{font-size:8.5px;letter-spacing:.16em;color:var(--dim2);margin-top:4px}
.cifra.persu .n{color:var(--neon)}
.cifra.rigor .n{color:var(--amber)}
#eqA .cifra.publico{border-left:1px solid var(--line);padding-left:10px}
#eqB .cifra.publico{border-right:1px solid var(--line);padding-right:10px}
.linea{
  border:1px solid var(--line);background:#0c131a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 12px;
}
.linea .lbl{font-size:8.5px;letter-spacing:.2em;color:var(--dim2)}
.cuotas{display:flex;gap:8px;font-family:var(--mono)}
.cuota{padding:2px 10px;border-radius:6px;background:#0a1016;border:1px solid var(--line);font-size:15px;font-weight:700}
.barra-votos{height:7px;width:100%;border-radius:99px;overflow:hidden;display:flex;background:#0a1016;border:1px solid var(--line)}
.barra-votos i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
@media (max-width:1100px){ .eq .id small{display:none} .cifra{min-width:58px} .cifra .n{font-size:22px} }

/* ---------- layout ---------- */
/* la página cabe siempre en la pantalla: las barras de arriba (login, sala) y el pie ocupan lo
   suyo y main toma el resto; antes la altura fija empujaba la SALA DE CONTROL fuera de la vista */
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
body > header, body > .marcador, body > footer, #barraEntrar, #barraOnline{flex:0 0 auto}
main{display:grid;grid-template-columns:1fr 372px;gap:0;flex:1 1 auto;min-height:0}
#modoLbl{cursor:pointer;text-decoration:underline dotted}
.cifra .l{white-space:nowrap}
.cifra.lidera .n{text-shadow:0 0 14px currentColor}
.cifra.publico .n{color:#a78bfa}
#ceremonia.tres{gap:18px}
#ceremonia.tres .cer-g{font-size:62px}
.btn.pri.todos-listos{animation:pulso 1s infinite;box-shadow:0 0 0 3px rgba(0,224,122,.35)}
.banca .lista-int span{font-size:11.5px}
.cifra.lidera .l{color:var(--txt)}
.cifra.lidera .l::before{content:"★ ";color:var(--amber)}
/* ---------- escenas: portada, intro, declaración del ganador (escenas.js) ---------- */
.av{width:var(--t);height:var(--t);border-radius:50%;border:3px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden;display:grid;place-items:center;background:#16212c;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.av span{font-weight:800;font-size:calc(var(--t)*.36);color:var(--c)}
#portada,#intro{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;
  background:radial-gradient(1100px 600px at 30% 20%,#0f2230 0%,transparent 60%),radial-gradient(900px 500px at 90% 90%,#1a1030 0%,transparent 60%),var(--bg)}
.po-top{display:flex;align-items:baseline;gap:18px;padding:18px 34px;color:var(--dim);letter-spacing:.12em;font-size:13px}
.po-top b{color:var(--neon);font-size:22px;letter-spacing:.3em}
.po-cuerpo{flex:1;display:flex;gap:48px;padding:10px 34px;min-height:0}
.po-entrar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:0 0 auto}
.po-k{letter-spacing:.3em;color:var(--dim);font-size:13px}
.po-qr{background:#fff;padding:18px;border-radius:16px;line-height:0}
.po-qr svg{width:min(34vh,340px);height:auto}
.po-codigo{font-size:min(13vh,110px);letter-spacing:.28em;color:var(--neon);line-height:1;text-shadow:0 0 30px rgba(0,224,122,.35)}
.po-url{color:var(--dim);font-size:15px}
.po-sala{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.po-tema{font-size:30px;font-weight:700;line-height:1.2;margin:10px 0 14px;max-width:900px}
.po-cuenta{display:flex;gap:20px;flex-wrap:wrap;font-size:15px;color:var(--dim);margin-bottom:16px}
.po-cuenta b{color:var(--txt);font-size:22px}
.po-gente{flex:1;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:18px 14px}
.po-vacio{color:var(--dim2);font-size:18px;margin-top:40px;animation:pulso 1.6s infinite}
.po-j{width:92px;display:flex;flex-direction:column;align-items:center;gap:6px}
.po-j.llega{animation:llega .7s cubic-bezier(.2,1.6,.4,1)}
.po-n{font-size:12.5px;text-align:center;line-height:1.2;max-width:92px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@keyframes llega{0%{transform:scale(0) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.po-pie{display:flex;align-items:center;gap:20px;padding:16px 34px 24px;color:var(--dim);font-size:15px}
.po-pie .btn{margin-left:auto;font-size:18px;padding:12px 30px}
#intro{align-items:center;justify-content:center;cursor:pointer}
.in-lamina{max-width:1150px;width:100%;padding:0 40px;text-align:center;opacity:0;transform:translateY(24px)}
.in-lamina.on{animation:entraLamina .8s cubic-bezier(.2,1,.3,1) forwards}
/* nombre propio: «entra» ya existe más abajo (tarjetas del chat) y lo pisaba, dejando la lámina invisible */
@keyframes entraLamina{to{opacity:1;transform:none}}
.in-k{letter-spacing:.34em;color:var(--amber);font-size:15px;margin-bottom:26px}
.in-tema{font-size:min(7vw,64px);font-weight:800;line-height:1.1}
.in-mocion{font-size:min(5.4vw,50px);font-weight:700;line-height:1.25;font-family:Georgia,"Times New Roman",serif}
.in-vs{display:flex;align-items:stretch;gap:30px;justify-content:center}
.in-lado{flex:1;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-top:4px solid var(--c);border-radius:16px;padding:28px 24px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.in-b{font-size:44px}.in-n{font-size:36px;font-weight:800;color:var(--c);letter-spacing:.06em;margin:6px 0 12px}
.in-l{font-size:24px;line-height:1.35;font-family:Georgia,serif}
.in-x{align-self:center;font-size:30px;font-weight:800;color:var(--dim2)}
.in-jueces{display:flex;gap:22px;text-align:left}
.in-jueces>div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.in-jueces b{display:block;letter-spacing:.14em;margin:6px 0 8px;font-size:17px}
.in-jueces span{color:var(--dim);font-size:16px;line-height:1.4}
.in-e{font-size:34px}
.in-tramos{margin-top:30px;display:flex;justify-content:center;gap:14px;align-items:center;font-size:17px;flex-wrap:wrap}
.in-tramos b{color:var(--neon);margin-right:4px}.in-tramos i{color:var(--dim);font-style:normal;margin-left:4px}.in-tramos em{color:var(--dim2);font-style:normal}
.in-nota{margin-top:20px;color:var(--dim);font-size:15px}
.in-pie{position:absolute;bottom:26px;left:34px;right:34px;display:flex;align-items:center;gap:10px}
.in-puntos{display:flex;gap:8px;margin-right:auto}
.in-puntos i{width:9px;height:9px;border-radius:50%;background:var(--dim2)}.in-puntos i.on{background:var(--neon)}
.in-pie .btn{font-size:16px;padding:10px 22px}
#ceremonia .cer-tablero{display:flex;flex-direction:column;align-items:center;gap:inherit;transition:opacity .6s}
#ceremonia.final .cer-tablero{opacity:0;pointer-events:none;position:absolute}
#ceremonia .cer-final{display:none;flex-direction:column;align-items:center;gap:16px}
#ceremonia.final .cer-final{display:flex}
#cerGpre{font-size:22px;letter-spacing:.32em;color:var(--amber);animation:pulso .8s infinite}
#cerG .cer-g{font-size:min(11vw,140px)}
#cerG .cer-mini{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;font-size:17px;color:var(--dim);margin-top:12px}
#cerG .cer-mini b{margin-left:6px}
/* ---------- columna de los jueces ---------- */
.msg.noticia{align-self:center;max-width:92%;background:#1f1508;border:1px solid var(--amber);--c:var(--amber)}
main .col{position:relative}
#propuesta{position:absolute;left:14px;right:14px;bottom:88px;z-index:20;background:#0f1822;border:1px solid var(--amber);border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#propuesta .pr-k{font-size:10.5px;letter-spacing:.2em;color:var(--amber);margin-bottom:8px}
#propuesta textarea{width:100%;background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font:600 17px/1.35 system-ui;resize:none}
#propuesta .pr-porque{color:var(--dim);font-size:12.5px;margin:6px 0}
#propuesta .pr-lados{display:flex;gap:8px;margin:8px 0}
#propuesta .pr-lados div{flex:1;border-top:2px solid var(--c);background:var(--panel);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--dim)}
#propuesta .pr-lados b{display:block;color:var(--c);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#propuesta .pr-grupos{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.12em;margin:8px 0}
#propuesta select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
#propuesta .pr-acc{display:flex;gap:8px;align-items:center}
#propuesta .pr-cuenta{margin-left:auto;color:var(--amber);font-family:var(--mono);font-size:12.5px}
#propuesta .pr-pensando{color:var(--dim);animation:pulso 1.4s infinite;margin-bottom:6px}
#propuesta .pr-aviso{color:var(--amber);font-size:12.5px;margin-bottom:6px}
#propuesta .pr-error{color:var(--hot);font-size:13px;font-weight:600;margin:0 0 8px}
#propuesta .pr-error:empty{display:none}
/* el minuto de preparación: la pregunta y la postura de cada lado, con la cuenta regresiva */
#preparacion{position:absolute;left:14px;right:14px;bottom:88px;z-index:20;background:#0f1822;border:1px solid var(--neon);border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#preparacion .pr-k{font-size:10.5px;letter-spacing:.2em;color:var(--neon);margin-bottom:8px;display:flex;justify-content:space-between}
#preparacion .pr-k span{font-size:22px;letter-spacing:0;color:var(--txt)}
#preparacion .prep-q{font:600 18px/1.35 system-ui;margin-bottom:8px}
#preparacion .pr-lados{display:flex;gap:10px;margin:8px 0}
#preparacion .pr-lados div{flex:1;border-top:3px solid var(--c);background:var(--panel);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--txt)}
#preparacion .pr-lados b{display:block;color:var(--c);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
#preparacion .pr-porque{color:var(--dim);font-size:12.5px}
.po-sw{display:flex;gap:8px;align-items:center;color:var(--txt);font-size:15px;margin-top:22px;cursor:pointer}
.po-cfg .po-sw input{width:18px;height:18px;display:inline-block;margin:0;padding:0}
.po-mapa{display:flex;gap:26px;align-items:center;width:100%}
.po-mapa .mapa{width:min(52vh,460px);height:auto;flex:none}
.po-mapa .pt.nuevo{animation:llega .6s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
.po-formar{display:flex;flex-direction:column;gap:10px;max-width:260px}
.po-tira{width:100%;display:flex;flex-wrap:wrap;gap:10px 6px;margin-top:4px}
.po-tira .po-j{width:64px;position:relative}
.po-ok{position:absolute;top:-2px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--neon);color:#04140b;font:800 11px/18px system-ui;text-align:center;font-style:normal}
/* la brújula en vivo (mapavivo.js): los puntos se deslizan en vez de saltar */
.mapa.vivo .pv{transition:transform .9s cubic-bezier(.22,.8,.28,1);transform-box:view-box}
.mapa.vivo .pv.llega{animation:mvLlega .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes mvLlega{from{opacity:0}to{opacity:1}}
.mapa.vivo .rastro{stroke-width:2;opacity:0}
.mapa.vivo .rastro.apaga{animation:mvRastro 2.6s ease-out}
@keyframes mvRastro{from{opacity:.55}to{opacity:0}}
.mapa.vivo .flecha{stroke-width:2;opacity:.45;stroke-dasharray:3 4}
@media (prefers-reduced-motion:reduce){.mapa.vivo .pv{transition:none}}
#mapaGrande{position:fixed;inset:0;z-index:70;background:radial-gradient(1100px 600px at 50% 20%,#10202b 0%,var(--bg) 70%) var(--bg);display:flex;flex-direction:column;padding:18px 26px;gap:10px}
#mapaGrande .mg-cab{display:flex;align-items:baseline;gap:18px}
#mapaGrande .mg-k{letter-spacing:.3em;color:var(--amber);font-size:15px}
#mapaGrande .mg-cuenta{font:700 22px var(--mono);color:var(--txt)}
#mapaGrande #mgCerrar{margin-left:auto}
#mapaGrande .mg-cuerpo{flex:1;display:flex;gap:28px;align-items:center;justify-content:center;min-height:0}
#mapaGrande .mg-mapa .mapa{height:auto;display:block}
#mapaGrande .mg-ley{display:flex;flex-direction:column;gap:12px;max-width:300px}
#mapaGrande .mg-c{border-left:4px solid var(--c);padding:4px 10px}
#mapaGrande .mg-c b{color:var(--c);font-size:17px}
#mapaGrande .mg-c i{font:700 22px var(--mono);margin-left:10px;font-style:normal}
#mapaGrande .mg-c span{display:block;color:var(--dim);font-size:12.5px}
#mapaGrande .mg-nota,#mapaGrande .mg-pie{color:var(--dim);font-size:12.5px}
#mapaGrande .mg-pie{text-align:center}
.aviso{color:var(--amber);font-size:13px}
.po-cfg{display:flex;gap:18px;margin:6px 0 12px;color:var(--dim);font-size:13px;flex-wrap:wrap}
.po-cfg input,.po-cfg textarea{background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:600 18px system-ui;width:min(560px,50vw);display:block;margin-top:4px}
/* el tema general: ocupa lo que haya y, si es largo, baja a otra línea en vez de cortarse */
.po-cfg .po-tema-l{flex:1 1 380px;min-width:0;max-width:760px}
.po-cfg #poTema{width:100%;box-sizing:border-box;resize:none;line-height:1.3;field-sizing:content;min-height:calc(1.3em + 16px);max-height:calc(3.9em + 16px);overflow:auto}
.po-cfg select{background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:600 18px system-ui;display:block;margin-top:4px}
.po-grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;width:100%}
.po-g{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:110px}
.po-gk{width:100%;font-size:12px;letter-spacing:.2em;color:var(--neon)}
/* clase con personajes: el cargo bajo el nombre, el estado de la inscripción y los tres duelos de la intro */
.po-gc{width:100%;font-size:11.5px;color:var(--dim);margin-top:-4px}
.po-cfg #poCupo{width:64px;display:block}
.po-cfg #poInscripcion{align-self:flex-end}
/* la inscripción: un botón secundario, pero activo (el primario es EMPEZAR) */
.btn.sec{background:rgba(0,224,122,.08);border:1px solid var(--neon);color:var(--neon);font-weight:700}
.btn.sec:hover:not(:disabled){background:rgba(0,224,122,.18);border-color:var(--neon);color:#7dffc0}
.po-cfg #poInscripcion.btn{font-size:13px;padding:10px 16px}
.po-ins{align-self:flex-end;padding-bottom:9px;color:var(--amber)}
.in-duelos{display:flex;flex-direction:column;gap:14px;text-align:left;max-width:980px;margin:0 auto}
.in-duelos>div{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 20px}
.in-duelos b{font-size:24px}.in-duelos b:last-of-type{text-align:right}
.in-duelos i{color:var(--dim);font-style:normal;letter-spacing:.14em;font-size:13px}
.in-duelos span{grid-column:1/-1;color:var(--txt);font-size:18px;text-align:center}
.po-gk span{float:right;color:var(--dim)}
.po-g .po-j{width:64px;cursor:pointer}

/* ---------- el modo escenario (escenario.js): el proyector sin botones ----------
   Se esconden los controles y la conversación; queda la vista de escenario (z 50). Las escenas
   (portada/intro 55, .escena 57, #resultado 58, #ceremonia 60) siguen encima, como siempre.
   Todas las medidas salen de --u (1 % del ancho en 16:9): la misma vista en 1920×1080 y 1280×720. */
body.escenario > header,body.escenario > .marcador,body.escenario > main,body.escenario > footer,body.escenario #barraOnline,body.escenario #barraEntrar{display:none}
/* el botón de las escenas no se ve desde la sala; con el mouse encima aparece (el control y →/Enter también sirven) */
body.escenario #esSig{opacity:0;transition:opacity .3s}
body.escenario #esSig:hover,body.escenario #esSig:focus-visible{opacity:1}
#escenarioVista{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;overflow:hidden;--u:min(1vw,1.78vh);--cA:var(--A);--cB:var(--B);
  background:radial-gradient(55% 75% at 0% 45%,color-mix(in srgb,var(--cA) 13%,transparent),transparent 72%),radial-gradient(55% 75% at 100% 45%,color-mix(in srgb,var(--cB) 13%,transparent),transparent 72%),radial-gradient(900px 500px at 50% -10%,#10202b,transparent 70%),#05080b}
body.escenario #escenarioVista{display:flex}
#escenarioVista .escn-debate,#escenarioVista .escn-espera{display:none}
#escenarioVista.debate .escn-debate{display:grid}
#escenarioVista.espera .escn-espera{display:flex}
.escn-debate{flex:1;min-height:0;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);gap:calc(var(--u)*1);padding:calc(var(--u)*1.1) calc(var(--u)*1.6) calc(var(--u)*1.2)}
.escn-cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3.2fr) minmax(0,1fr);align-items:center;gap:calc(var(--u)*2)}
.escn-marca b{display:block;font-family:var(--mono);color:var(--neon);letter-spacing:.3em;font-size:calc(var(--u)*1.25);text-shadow:0 0 18px rgba(0,224,122,.45)}
.escn-marca span{display:block;color:var(--amber);letter-spacing:.24em;font-weight:800;font-size:calc(var(--u)*1.05);margin-top:calc(var(--u)*.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.escn-gusano{grid-row:4}
.escn-tj.fuera{visibility:hidden}
.escn-mocion{font:700 calc(var(--u)*1.9)/1.22 Georgia,"Times New Roman",serif;text-align:center;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.escn-reloj{justify-self:end;text-align:right;line-height:1}
.escn-reloj small{display:block;letter-spacing:.3em;color:var(--dim);font-size:calc(var(--u)*.85);margin-bottom:calc(var(--u)*.3)}
.escn-reloj b{font-size:calc(var(--u)*4.2);font-weight:800;color:var(--txt)}
.escn-reloj.chico b{font-size:calc(var(--u)*2.2);color:var(--dim)}
.escn-reloj.urgente b{color:var(--hot);animation:pulso .9s infinite}
.escn-medio{position:relative;display:grid;grid-template-columns:minmax(0,27fr) minmax(0,46fr) minmax(0,27fr);gap:calc(var(--u)*1.4);min-height:0}
.escn-podio{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.55);min-height:0;overflow:hidden;padding:calc(var(--u)*1.2) calc(var(--u)*1.4);border-radius:calc(var(--u)*1.1);
  border-top:calc(var(--u)*.35) solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 15%,#0b1117),rgba(10,16,22,.72) 70%);transition:box-shadow .4s}
.escn-podio[data-k="B"]{align-items:flex-end;text-align:right}
.escn-podio.habla{box-shadow:0 0 0 2px var(--c),0 0 calc(var(--u)*4) color-mix(in srgb,var(--c) 40%,transparent)}
.escn-lado{color:var(--c);letter-spacing:.32em;font-weight:800;font-size:calc(var(--u)*1.05)}
.escn-nombre{color:var(--c);font-weight:900;font-size:calc(var(--u)*2.9);line-height:1.12;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.escn-nombre.largo{font-size:calc(var(--u)*2.35)}
/* el color del personaje, solo como un punto junto a su nombre: el podio va en el del lado */
.escn-nombre.pj::before{content:"";display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--cp);box-shadow:0 0 .35em color-mix(in srgb,var(--cp) 70%,transparent);margin-right:.3em;vertical-align:.17em}
.escn-cargo{color:var(--dim);font-size:calc(var(--u)*1.1);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.escn-cargo:empty{display:none}
.escn-podio > *{flex-shrink:0}
.escn-caras{align-self:stretch;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.5) min(.9vw,1.6vh);margin-top:calc(var(--tc,60px)*.3);align-items:flex-end}
.escn-podio[data-k="B"] .escn-caras{justify-content:flex-end}
.escn-cara{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.3);position:relative;transition:margin .3s}
.escn-cara span{font-size:calc(var(--u)*.9);color:var(--dim);max-width:calc(var(--u)*6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.escn-cara .av{transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .35s;transform-origin:50% 100%}
.escn-cara.habla{margin:0 calc(var(--tc,60px)*.16);z-index:1}
.escn-cara.habla .av{transform:scale(1.32);box-shadow:0 0 0 calc(var(--u)*.35) color-mix(in srgb,var(--c) 35%,transparent),0 0 calc(var(--u)*2.6) var(--c)}
.escn-cara.habla span{color:var(--txt);font-weight:800}
.escn-cara.habla::after{content:"🎤";position:absolute;top:calc(var(--u)*-1.4);right:calc(var(--u)*-1);font-size:calc(var(--u)*1.5);animation:pulso 1s infinite}
.escn-cara.pide::before{content:"✋";position:absolute;top:calc(var(--u)*-1);left:calc(var(--u)*-.8);font-size:calc(var(--u)*1.6);z-index:2;animation:latido 1s infinite}
.escn-nadie{color:var(--dim2);font-size:calc(var(--u)*1)}
.escn-crono{margin-top:auto;line-height:1}
.escn-crono.sin{display:none}
.escn-crono b{display:block;font-size:min(calc(var(--u)*5.4),8.6vh);font-weight:800;color:var(--txt);letter-spacing:.02em}
.escn-crono small{display:block;margin-top:calc(var(--u)*.35);letter-spacing:.18em;font-size:calc(var(--u)*.95);color:var(--dim);font-weight:700;text-transform:uppercase}
.escn-crono.corre b{color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
.escn-crono.corre small{color:var(--c)}
.escn-crono.urgente b{color:var(--hot);text-shadow:0 0 26px rgba(244,63,94,.55)}
.escn-crono.corre.urgente b{animation:pulso .9s infinite}
.escn-crono.agotado b{color:var(--dim2);text-shadow:none}
.escn-crono.agotado small{color:var(--hot)}
.escn-crono.punto b{color:var(--dim)}
.escn-crono.punto small{color:var(--neon)}
.escn-part{width:100%}
.escn-part small{display:block;font-size:calc(var(--u)*.85);color:var(--dim);margin-top:calc(var(--u)*.2)}
.escn-bz{height:calc(var(--u)*.6);margin:0}
.escn-centro{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;overflow:hidden}
.escn-msgs{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(var(--u)*.7);min-height:0;overflow:hidden;padding-top:calc(var(--u)*1.2);
  -webkit-mask-image:linear-gradient(transparent,#000 calc(var(--u)*1.2));mask-image:linear-gradient(transparent,#000 calc(var(--u)*1.2))}
.escn-tj{position:relative;flex:0 0 auto;background:#0e161e;border:1px solid #1c2733;border-left:calc(var(--u)*.3) solid var(--c,var(--dim2));border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.1) calc(var(--u)*.8)}
.escn-tj.B{border-left-width:1px;border-right:calc(var(--u)*.3) solid var(--c)}
.escn-tj.mod{--c:#b4a6ff;background:#17142a;border-color:#3b3170}
.escn-tj.mod.trib{--c:var(--amber);background:#1f1809;border-color:#5a4212}
.escn-tj.noticia{--c:var(--amber);background:#1f1508;border-color:#6b4a10}
.escn-tj.nueva{animation:escnEntra .55s cubic-bezier(.2,1,.3,1)}
@keyframes escnEntra{from{opacity:0;transform:translateY(calc(var(--u)*1.4)) scale(.98)}}
.escn-tj-q{display:flex;align-items:baseline;gap:calc(var(--u)*.6);font-size:calc(var(--u)*.95);min-width:0}
.escn-tj-q b{color:var(--c);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.escn-tj-q span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.escn-tj-q em{font-style:normal;margin-left:auto}
.escn-tj .tx{margin:calc(var(--u)*.2) 0 0;font-size:calc(var(--u)*1.3);line-height:1.34;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.escn-tj .mencion{color:#c4b5fd}
.escn-rx{display:flex;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*.4)}
.escn-rx:empty{display:none}
.escn-rx span{font-size:calc(var(--u)*1);background:#0a1016;border:1px solid var(--line);border-radius:99px;padding:0 calc(var(--u)*.6)}
.escn-rx b{font-family:var(--mono)}
.escn-sello{display:none;position:absolute;top:calc(var(--u)*-.6);right:calc(var(--u)*1.2);transform:rotate(-7deg);padding:calc(var(--u)*.15) calc(var(--u)*.7);border:calc(var(--u)*.2) solid var(--amber);border-radius:calc(var(--u)*.4);
  color:var(--amber);background:#1a1204;font-weight:900;letter-spacing:.16em;font-size:calc(var(--u)*.95);box-shadow:0 4px 18px rgba(0,0,0,.6)}
.escn-tj.duda{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 calc(var(--u)*1.6) rgba(255,176,32,.25)}
.escn-tj.duda .escn-sello{display:block;animation:escnSello .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes escnSello{from{transform:rotate(-7deg) scale(2.2);opacity:0}}
.escn-flota{position:absolute;bottom:40%;font-size:calc(var(--u)*2.4);pointer-events:none;animation:escnFlota 1.5s ease-out forwards;z-index:3}
@keyframes escnFlota{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(calc(var(--u)*-1)) scale(1.15)}100%{transform:translateY(calc(var(--u)*-9)) scale(1);opacity:0}}
/* la franja de los subtítulos, bajo los podios */
.escn-subs{grid-row:3;grid-column:1;display:flex;gap:calc(var(--u)*1.4);min-width:0}
.escn-sub{flex:0 1 64%;min-width:0;position:relative}
.escn-sub[data-k="B"]{margin-left:auto}
.escn-sub.vacio{display:none}
.escn-sub.vivo{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,#070b10),#070b10ee);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:calc(var(--u)*.45) solid var(--c);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8) calc(var(--u)*1.4) calc(var(--u)*.9);box-shadow:0 0 calc(var(--u)*3) color-mix(in srgb,var(--c) 22%,transparent)}
.escn-sub[data-k="A"]{--c:var(--cA)}.escn-sub[data-k="B"]{--c:var(--cB)}
.escn-sub.vivo[data-k="B"]{border-left-width:1px;border-right:calc(var(--u)*.45) solid var(--c)}
.escn-sub-q{display:flex;align-items:baseline;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.15);min-width:0}
.escn-sub-q b{color:var(--c);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.escn-sub-q span{color:var(--dim);white-space:nowrap}
.escn-envivo{font-style:normal;font-weight:900;letter-spacing:.16em;color:var(--hot);font-size:calc(var(--u)*.85);animation:pulso 1.2s infinite;white-space:nowrap}
.escn-sub-t{max-height:calc(var(--u)*2.15*1.24*3);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-top:calc(var(--u)*.3)}
.escn-sub-t p{margin:0;font-size:calc(var(--u)*2.15);line-height:1.24;font-weight:600;overflow-wrap:anywhere}
.escn-cursor{display:inline-block;width:.45em;height:.9em;margin-left:.12em;vertical-align:-.08em;background:var(--c);animation:escnCursor 1s steps(1) infinite}
@keyframes escnCursor{50%{opacity:0}}
.escn-sub.ultimo .escn-tj{background:#0c141c;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.escn-sub.ultimo .escn-tj-q{font-size:calc(var(--u)*1.05)}
.escn-sub.ultimo .escn-tj .tx{font-size:calc(var(--u)*1.6);line-height:1.3}
/* el rótulo inferior de la moderadora (y la pregunta de la tribuna) */
.escn-rotulo{grid-row:3;grid-column:1;align-self:stretch;position:relative;z-index:5;display:none;align-items:center;gap:calc(var(--u)*1.6);
  padding:calc(var(--u)*1.1) calc(var(--u)*1.8);border-radius:calc(var(--u)*1);border-left:calc(var(--u)*.5) solid #8b7bff;
  background:linear-gradient(90deg,#2a2152 0%,#1b1830 55%,#141126);box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.7)}
.escn-rotulo.on{display:flex;animation:escnRotulo .6s cubic-bezier(.2,1,.3,1)}
@keyframes escnRotulo{from{opacity:0;transform:translateY(calc(var(--u)*3))}}
.escn-rot-c{min-width:0;flex:1}
.escn-rot-k{letter-spacing:.26em;color:#c4b5fd;font-weight:800;font-size:calc(var(--u)*1)}
.escn-rot-t{font-size:calc(var(--u)*1.75);line-height:1.3;font-weight:600;margin-top:calc(var(--u)*.3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.escn-rotulo.fuente{border-left-color:var(--amber)}
.escn-rotulo.fuente .escn-rot-k{color:var(--amber)}
.escn-rotulo.trib{border-left-color:var(--amber);background:linear-gradient(90deg,#3d2b07 0%,#221806 55%,#181105)}
.escn-rotulo.trib .escn-rot-k{color:var(--amber)}
.escn-rotulo.trib .escn-rot-k b{color:var(--txt);letter-spacing:.04em;font-size:calc(var(--u)*1.15)}
.escn-rot-k span{letter-spacing:.04em;color:var(--dim)}
.escn-rot-q{font:700 calc(var(--u)*2.3)/1.24 Georgia,"Times New Roman",serif;margin-top:calc(var(--u)*.35);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
/* el punto de información, arriba al centro */
.escn-punto{position:relative;flex:0 0 auto;margin-bottom:calc(var(--u)*.3);z-index:4;display:none;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*.2);
  padding:calc(var(--u)*.9) calc(var(--u)*1.4);border-radius:calc(var(--u)*1);border:calc(var(--u)*.2) solid var(--amber);background:#241905;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*3) rgba(0,0,0,.7)}
.escn-punto.on{display:flex;animation:escnEntra .45s cubic-bezier(.2,1.4,.4,1)}
.escn-punto.pedido{animation:escnEntra .45s cubic-bezier(.2,1.4,.4,1),escnLlama 1.1s .45s infinite}
@keyframes escnLlama{50%{box-shadow:0 0 0 calc(var(--u)*.5) rgba(255,176,32,.35),0 0 calc(var(--u)*3) rgba(255,176,32,.45)}}
.escn-pt-k{letter-spacing:.26em;font-weight:800;color:var(--amber);font-size:calc(var(--u)*1)}
.escn-pt-t{font-weight:900;font-size:calc(var(--u)*2.1);line-height:1.15}
.escn-pt-s{color:var(--dim);font-size:calc(var(--u)*1.1)}
.escn-punto.aceptado{border-color:var(--neon);background:#062015}
.escn-punto.aceptado .escn-pt-k{color:var(--neon)}
.escn-punto.aceptado .escn-pt-s{font:800 calc(var(--u)*2.4) var(--mono);color:var(--neon)}
.escn-punto.rechazado{border-color:var(--hot);background:#2a0b12}
.escn-punto.rechazado .escn-pt-t{color:var(--hot)}
.escn-punto.vencido,.escn-punto.terminado{border-color:var(--dim2);background:#10161c}
.escn-punto.vencido .escn-pt-k,.escn-punto.terminado .escn-pt-k{color:var(--dim)}
/* el gusano */
.escn-gusano{position:relative;height:min(110px,12vh);border:1px solid var(--line);border-radius:calc(var(--u)*.8);background:#081017;overflow:hidden}
.escn-gusano.oculto{display:none}
.escn-gusano-svg{position:absolute;inset:0}
.escn-gusano-svg svg{display:block;width:100%;height:100%}
.escn-gusano-k{position:absolute;right:calc(var(--u)*1);top:50%;transform:translateY(-50%);font-size:calc(var(--u)*.9);letter-spacing:.2em;color:var(--dim);font-weight:700;background:#081017cc;padding:0 calc(var(--u)*.5)}
/* entre debates */
.escn-espera{flex:1;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*4);text-align:center}
.escn-es-k{letter-spacing:.34em;color:var(--amber);font-weight:800;font-size:calc(var(--u)*1.2);max-width:90%}
.escn-es-t{font-weight:900;font-size:calc(var(--u)*4.4);line-height:1.05;letter-spacing:.02em;text-wrap:balance;text-shadow:0 0 50px rgba(0,224,122,.18)}
.escn-es-q{font:700 calc(var(--u)*2.8)/1.22 Georgia,"Times New Roman",serif;max-width:min(1600px,90%);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.escn-es-reloj{font-size:calc(var(--u)*6.5);font-weight:800;line-height:1;color:var(--neon);text-shadow:0 0 40px rgba(0,224,122,.4)}
.escn-es-lados{display:flex;gap:calc(var(--u)*2);width:min(1600px,92%)}
.escn-es-lado{flex:1;text-align:left;border-top:calc(var(--u)*.3) solid var(--c);border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.4);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,transparent),rgba(10,16,22,.6))}
.escn-es-lado b{display:block;color:var(--c);letter-spacing:.2em;font-size:calc(var(--u)*1.1);margin-bottom:calc(var(--u)*.4)}
.escn-es-lado span{font:calc(var(--u)*1.6)/1.35 Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.escn-es-pie{color:var(--dim);font-size:calc(var(--u)*1.4)}
.escn-rk{display:flex;flex-direction:column;gap:calc(var(--u)*.6);width:min(1100px,70%);margin-top:calc(var(--u)*.6)}
.escn-rk-k{letter-spacing:.3em;color:var(--dim);font-size:calc(var(--u)*1);font-weight:700;margin-bottom:calc(var(--u)*.3)}
.escn-rk-f{display:grid;grid-template-columns:calc(var(--u)*5) minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*1.6);border-radius:calc(var(--u)*.9);
  background:#0d151d;border:1px solid var(--line);border-left:calc(var(--u)*.35) solid var(--c);text-align:left;animation:escnEntra .6s both}
.escn-rk-f:nth-child(3){animation-delay:.1s}.escn-rk-f:nth-child(4){animation-delay:.2s}.escn-rk-f:nth-child(5){animation-delay:.3s}.escn-rk-f:nth-child(6){animation-delay:.4s}
.escn-rk-f span{color:var(--dim);font-size:calc(var(--u)*1.7)}
.escn-rk-f b{font-size:calc(var(--u)*2.1);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.escn-rk-f i{font-style:normal;font-size:calc(var(--u)*2.1);font-weight:800;color:var(--neon)}
.escn-rk-f:nth-child(2){background:linear-gradient(90deg,#1d1808,#0d151d 60%);border-top-color:#5a4212;border-right-color:#5a4212;border-bottom-color:#5a4212}
.escn-rk-f:nth-child(2) span{color:var(--amber)}
/* el aviso del sonido: arriba, a todo el ancho, hasta el primer toque; la vista baja para no quedar tapada */
body.escn-audio #escenarioVista{top:40px}
#escnAudio{position:fixed;top:0;left:0;right:0;z-index:95;height:40px;line-height:20px;padding:10px 18px;overflow:hidden;white-space:nowrap;text-align:center;font:700 min(1.2vw,2vh,20px) system-ui,sans-serif;letter-spacing:.06em;color:#04140c;
  background:linear-gradient(90deg,#00b862,#00e07a,#00b862);box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:pointer;animation:baja .5s}
/* pantallas bajas (1280×720): menos aire entre las partes del podio */
@media (max-height:820px){.escn-podio{gap:calc(var(--u)*.35);padding:calc(var(--u)*.9) calc(var(--u)*1.2)}.escn-part small{display:none}.escn-debate{gap:calc(var(--u)*.8)}}
@media (prefers-reduced-motion:reduce){.escn-tj.nueva,.escn-rotulo.on,.escn-punto.on,.escn-rk-f,.escn-flota,.escn-cursor,.escn-envivo{animation:none}}
.vb{width:min(1100px,90vw);display:flex;flex-direction:column;gap:22px;margin-top:10px}
.vb-fila{display:grid;grid-template-columns:260px 1fr 80px;gap:16px;align-items:center;transition:opacity .6s}
.vb-n{color:var(--c);font-weight:800;letter-spacing:.08em;font-size:18px;text-align:right}
.vb-barra{height:54px;background:#0a1016;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vb-barra i{display:block;height:100%;width:0;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vb-c{font-size:44px;font-weight:800;color:var(--c)}
.escena.cerrada .vb-fila:not(.gana){opacity:.35}
.vb-fila.gana .vb-barra{box-shadow:0 0 34px var(--c)}
.jz-lados{display:flex;gap:28px;font-weight:700;letter-spacing:.1em}
.jz{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:min(1400px,96vw)}
.jz-col{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;opacity:.25;transition:opacity .5s}
.jz-col.on{opacity:1}
.jz-e{font-size:36px}.jz-n{font-weight:800;margin-top:4px}.jz-p{color:var(--dim);font-size:11.5px;min-height:30px}
.jz-t{display:flex;gap:8px;justify-content:center;margin:10px 0}
.tj{width:64px;height:84px;border-radius:10px;background:#f5f1e6;color:#0b1117;font:800 38px/84px var(--mono);border-top:6px solid var(--c);
  transform:rotateY(90deg);transition:transform .5s;position:relative}
.jz-col.on .tj{transform:none}
.tj.tachada{opacity:.35}
.tj.tachada::after{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:4px solid var(--hot);transform:rotate(-20deg)}
.jz-f{display:flex;flex-direction:column;gap:4px;font-size:12px;min-height:48px}
.jz-f i{font-style:normal}
.jz-tot{display:flex;gap:60px;margin-top:6px}
.jz-tot div{text-align:center;color:var(--c)}
.jz-tot b{display:block;font-size:64px}
.jz-sim{color:var(--dim2);font-size:12px}
.rs-tablas{display:flex;gap:26px;align-items:flex-start}
.rs-or{min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rs-ork{letter-spacing:.2em;color:#a78bfa;font-size:12px;margin-bottom:8px}
.rs-or div{display:flex;gap:10px;align-items:baseline;padding:3px 0}.rs-or span{color:var(--dim);width:28px;font-family:var(--mono)}
.rs-or i{margin-left:auto;font:700 16px var(--mono);font-style:normal;color:#a78bfa}
.up{padding:8px 14px}
.up-q{font-size:12.5px;color:var(--dim);margin-bottom:6px}.up-q b{color:var(--txt)}
.up-j{display:grid;grid-template-columns:24px 1fr 34px 34px;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.up-j i{font-style:normal;color:var(--dim)}.up-j b{font-family:var(--mono);text-align:right}
/* ceremonia del ganador */
#ceremonia{position:fixed;inset:0;z-index:60;background:radial-gradient(900px 500px at 50% 40%,#0f1c26 0%,rgba(3,6,9,.98) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
#ceremonia .cer-k{font-size:15px;letter-spacing:.32em;color:var(--dim)}
#cer0{font-size:22px;color:var(--amber);animation:pulso 1s infinite}
#ceremonia .cer-bloque,#ceremonia .cer-lect{opacity:0;transform:scale(.7);transition:all .7s cubic-bezier(.2,1.5,.4,1)}
#ceremonia .on{opacity:1;transform:scale(1)}
#ceremonia .cer-g{font-size:84px;font-weight:800;letter-spacing:.05em;line-height:1.05;text-shadow:0 0 40px currentColor}
#ceremonia .cer-s{font-family:var(--mono);font-size:22px;color:var(--dim);margin-top:6px}
#ceremonia .cer-lect{font-size:24px;color:var(--txt);max-width:900px}
.col{display:flex;flex-direction:column;min-height:0}
.col.der{border-left:1px solid var(--line);background:#0b1117}
.cab{
  display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.17em;color:var(--dim);background:#0a1016;flex:0 0 auto;
}
.cab .pt{margin-left:auto;color:var(--dim2);letter-spacing:0;font-size:11px}

/* ---------- mesa de escritura ---------- */
.mesa{padding:12px 16px;border-top:1px solid var(--line);background:#0c1219;flex:0 0 auto;order:3}
.feed{order:2}
/* «Grupo N está escribiendo…», bajo la conversación */
.escribiendo{order:2;display:flex;gap:18px;min-height:22px;padding:2px 16px 4px;font-size:12.5px;font-weight:600;flex:0 0 auto}
.escribiendo:empty{visibility:hidden}
.escribiendo i{animation:pulso 1.2s infinite;font-style:normal}
/* la conversación, estilo WhatsApp */
.pauta-bar{padding:8px 16px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);background:#0b1117}
.pauta-bar b{color:var(--amber);letter-spacing:.06em}
.participantes{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;border-bottom:1px solid var(--line);font-size:11px}
.participantes .pl{color:var(--dim)}
.participantes .pl span{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--c)}
.participantes .pl span.cero{color:var(--dim2);border-style:dashed}
/* la barra de participación (barravista.js) */
.participantes:has(.bz){gap:22px;padding:8px 16px 10px}
.participantes .pl:has(.bz){flex:1;min-width:0}
.bz-cab{display:flex;align-items:baseline;gap:10px;font-size:12px}
.participantes .pl .bz-cab span{border:none;padding:0;margin:0;border-radius:0}
.participantes .pl .bz-cab .bz-pct{margin-left:auto;color:var(--txt)}
.bz-sello:empty{display:none}
.bz-cab b{color:var(--c);letter-spacing:.04em}
.bz-pct{margin-left:auto;font-size:15px;font-weight:800;color:var(--txt)}
.bz-sello{color:var(--neon);font-size:11.5px;font-weight:700}
.bz-barra{height:14px;border-radius:99px;background:#101820;border:1px solid var(--line);overflow:hidden;margin:5px 0 6px;--f:#f43f5e}
.bz-barra.ambar{--f:#ffb020}.bz-barra.verde{--f:#00e07a}.bz-barra.lleno{--f:#38bdf8;box-shadow:0 0 14px #38bdf8aa,0 0 3px #38bdf8}
.bz-llen{height:100%;width:0;background:var(--f);border-radius:99px;transition:width .8s cubic-bezier(.22,.8,.28,1),background .6s}
.bz-barra.lleno .bz-llen{background:linear-gradient(90deg,#38bdf8,#a5f3fc,#38bdf8);background-size:200% 100%;animation:bzBrillo 1.6s linear infinite}
@keyframes bzBrillo{to{background-position:-200% 0}}
.bz-tajadas{display:flex;flex-wrap:wrap;gap:4px}
.participantes .pl .bz-t{position:relative;overflow:hidden;display:inline-block;margin:0;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;color:var(--dim)}
.bz-t i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);opacity:.28;transition:width .8s}
.bz-t em{position:relative;font-style:normal}
.participantes .pl .bz-t.cero{border-style:dashed;color:var(--dim2)}
.participantes .pl .bz-t.full{border-color:var(--c);color:var(--txt)}
.bz-t.full i{opacity:.55}
.bz-t.pop{animation:bzPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bzPop{50%{transform:scale(1.35)}}
.bz-vacio{color:var(--dim2);font-size:11px}
#bzCartel{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:81;padding:16px 30px;border-radius:16px;background:#0b1520ee;border:2px solid var(--c);color:var(--txt);font:800 30px system-ui;letter-spacing:.02em;box-shadow:0 0 40px var(--c);animation:bzCartel 3.5s ease both;pointer-events:none}
@keyframes bzCartel{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.feed.chat{display:flex;flex-direction:column;gap:2px;background:radial-gradient(700px 400px at 50% 0%,#0d1820 0%,transparent 70%)}
.msg{max-width:66%;margin:5px 4px;padding:8px 12px 9px;border-radius:14px;font-size:13.5px;line-height:1.5;position:relative}
.msg .who{font-size:11px;font-weight:700;color:var(--c);margin-bottom:2px}
.msg .hora{float:right;margin-left:10px;font-weight:400;color:var(--dim2);font-size:10px}
.msg .tx{white-space:pre-wrap}
.msg.A{align-self:flex-start;background:#0f2536;border:1px solid rgba(56,189,248,.28);border-top-left-radius:4px}
.msg.B{align-self:flex-end;background:#33131c;border:1px solid rgba(251,113,133,.28);border-top-right-radius:4px}
.msg.mod{align-self:center;max-width:78%;background:#1b1830;border:1px solid #6d5bd0;--c:#b4a6ff}
.msg.rel{align-self:center;max-width:86%;background:#221c0c;border:1px solid rgba(255,176,32,.6);--c:var(--amber)}
.msg.rel ul{margin:3px 0 4px 18px;padding:0}
.msg.rel .pedido{margin-top:6px;color:var(--neon);font-weight:600}
.msg.sys{align-self:center;background:none;color:var(--dim2);font-size:11px}
.msg.res{align-self:stretch;max-width:none;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c)}
.res-head{display:flex;align-items:center;gap:9px;font-size:12px}
.res-head > b{color:var(--c);letter-spacing:.1em}
.res-head .rol{color:var(--dim);flex:1}
.res-head .delta{font-family:var(--mono);font-size:18px;font-weight:700;padding:3px 10px;border-radius:7px;background:#0a1016}
.res-head .delta.pos{color:var(--neon)} .res-head .delta.neg{color:var(--hot)} .res-head .delta.cero{color:var(--dim)}
.res-alumnos{margin-top:6px;text-align:left}
.msg.res .dicen .dice{text-align:left}
.res-alumnos .ra{font-size:12px;color:var(--dim);padding:3px 0;border-top:1px dashed var(--line)}
.res-alumnos .ra b{color:var(--txt);margin-right:6px}
.res-alumnos .rg{font-family:var(--mono);font-weight:700;margin-right:8px}
.res-alumnos .nt{color:var(--amber)}
.mencion{color:#c4b5fd}
.compositor{display:flex;gap:8px;align-items:stretch;position:relative}
.sugiere{position:absolute;left:0;right:0;bottom:calc(100% + 6px);display:none;flex-direction:column;background:#101820;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 -12px 34px rgba(0,0,0,.55);max-height:260px;overflow-y:auto;z-index:30}
.sugiere.on{display:flex}
.sugiere .sg{display:flex;align-items:baseline;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugiere .sg.on,.sugiere .sg:hover{background:#17222d}
.sugiere .sg-n{font-weight:700}.sugiere .sg-g{color:var(--dim);font-size:12px;margin-left:auto}
.sugiere .sg-vacio{padding:10px 12px;color:var(--dim);font-size:12.5px}
.compositor .bancas{display:flex;flex-direction:column;gap:4px}
.compositor .banca-t{opacity:.45;border-color:var(--c);color:var(--c);white-space:nowrap}
.compositor .banca-t.on{opacity:1;background:#101820;box-shadow:inset 0 0 0 1px var(--c)}
.compositor textarea{flex:1;background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;resize:none}
.compositor textarea:focus{outline:none;border-color:var(--dim)}
.banca textarea{min-height:64px}
.banca .lista-int{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.banca .lista-int span{font-size:10.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.banca .lista-int span.ok{border-color:rgba(0,224,122,.5);color:var(--neon)}
/* turno: cabecera de lo que hizo una bancada en la ronda */
.turno{margin:10px 14px 4px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;background:var(--panel2);padding:9px 12px}
.turno-head{display:flex;align-items:center;gap:9px;font-size:12px}
.turno-head .bandera{font-size:16px}
.turno-head > b{color:var(--c);letter-spacing:.1em;font-size:12px}
.turno-head .rol{color:var(--dim);flex:1;min-width:0}
.turno-head .delta{font-family:var(--mono);font-size:18px;font-weight:700;padding:3px 10px;border-radius:7px;background:#0a1016}
.turno-head .delta.pos{color:var(--neon)}
.turno-head .delta.neg{color:var(--hot)}
.turno-head .delta.cero{color:var(--dim)}
.dicen{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.dicen .dice{font-size:11.5px;color:var(--dim);background:#0a1016;border-radius:7px;padding:6px 8px;line-height:1.35}
.dicen .dice b{color:var(--txt);margin:0 4px}
.dicen .dice i{display:block;color:#c9d3dc;margin-top:2px}
.card .rigor-big{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:700}
.card .rigor-big small{font-size:10px;color:var(--dim2);margin-left:2px}
.card .nota{color:var(--amber);font-size:12.5px;margin:6px 0 2px;line-height:1.4}
.pauta{font-size:12px;color:var(--dim);margin-bottom:9px}
.pauta b{color:var(--amber);letter-spacing:.06em}
.bancadas{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.banca{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px;position:relative}
.banca.lista{border-color:var(--neon);box-shadow:0 0 0 1px rgba(0,224,122,.18)}
.banca .top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.banca .top b{font-size:11px;letter-spacing:.1em;color:var(--c)}
.banca select{
  margin-left:auto;background:#0a1016;color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;font-size:11px;
}
.banca textarea{
  width:100%;height:76px;resize:vertical;background:#080d12;color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:8px 9px;font:inherit;line-height:1.45;
}
.banca textarea:focus{outline:none;border-color:var(--c)}
.banca textarea:disabled{opacity:.4}
.banca .pie{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10.5px;color:var(--dim2)}
.banca .pie .ok{margin-left:auto;color:var(--neon);letter-spacing:.1em;display:none}
.banca.lista .pie .ok{display:block}

.acciones{display:flex;gap:9px;margin-top:11px;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:8px 16px;border-radius:8px;font-size:12px;letter-spacing:.09em;transition:.15s;
}
.btn:hover:not(:disabled){border-color:var(--dim);background:#1b2530}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#00e07a,#00b862);color:#04140c;border:none;font-weight:700}
/* sin el fondo repetido, el :hover de .btn (más específico) lo dejaba gris con letra oscura */
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#00e07a,#00b862);filter:brightness(1.12)}
.btn.sm{padding:5px 10px;font-size:11px}
.hint{font-size:11px;color:var(--dim2);margin-left:auto}

/* ---------- feed ---------- */
.feed{flex:1;overflow-y:auto;padding:14px 16px 40px}
.turno-sep{
  display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-family:var(--mono);
  font-size:10px;letter-spacing:.22em;color:var(--dim2);
}
.turno-sep::before,.turno-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.card{
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;
  background:var(--panel);padding:11px 13px;margin-bottom:11px;
  animation:entra .45s cubic-bezier(.2,.9,.3,1);
}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.card .head{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px}
.card .head b{color:var(--c);letter-spacing:.05em}
.card .head .rol{color:var(--dim2);font-size:10.5px}
.card .head .delta{
  margin-left:auto;font-family:var(--mono);font-weight:700;font-size:14px;padding:1px 9px;border-radius:6px;
}
.delta.pos{color:var(--neon);background:rgba(0,224,122,.1)}
.delta.neg{color:var(--hot);background:rgba(244,63,94,.1)}
.delta.cero{color:var(--dim2);background:#0a1016}
.card .txt{font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2.5px 7px;border-radius:5px;
  background:#0a1016;border:1px solid var(--line);color:var(--dim);
}
.chip b{color:var(--txt)}
.chip.kb{color:var(--amber);border-color:rgba(255,176,32,.28)}
.chip.bandera{color:var(--hot);border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.07)}
.chip.total{color:#04140c;background:var(--amber);border-color:var(--amber);font-weight:700}

/* ---------- audiencia ---------- */
.resumen{
  display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a1016;flex:0 0 auto;
}
.res{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:var(--panel)}
.res .n{font-family:var(--mono);font-size:19px;font-weight:700}
.res .l{font-size:8px;letter-spacing:.13em;color:var(--dim2)}
.gente{flex:1;overflow-y:auto;padding:11px 12px 30px}
.p{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px 10px;margin-bottom:9px}
.p .top{display:flex;align-items:center;gap:8px}
.p .av{font-size:19px;width:26px;text-align:center}
.p .who{flex:1;min-width:0}
.p .who b{font-size:12px;display:block}
.p .who small{font-size:9.5px;color:var(--dim2);letter-spacing:.1em}
.p .mv{font-family:var(--mono);font-size:12.5px;font-weight:700;min-width:38px;text-align:right}
.eje{position:relative;height:6px;margin:8px 0 6px;background:#0a1016;border:1px solid var(--line);border-radius:99px}
.eje .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim2)}
.eje .dot{
  position:absolute;top:50%;width:11px;height:11px;border-radius:99px;transform:translate(-50%,-50%);
  background:var(--c);box-shadow:0 0 12px var(--c);transition:left .9s cubic-bezier(.2,.8,.2,1);
}
.p .say{font-size:11.5px;color:var(--dim);font-style:italic;line-height:1.45;min-height:16px}
.p.reacciona{animation:flash .7s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)}100%{box-shadow:0 0 0 9px rgba(255,176,32,0)}}

/* ---------- sala de control ---------- */
footer{
  display:flex;align-items:center;gap:8px;padding:8px 18px;border-top:1px solid var(--line);
  background:#0a1016;font-size:11px;color:var(--dim2);
}
footer .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ticker{
  flex:1;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--amber);
}
select.ev{background:#0d141b;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;max-width:230px}

/* ---------- overlays ---------- */
.flash-ev{
  position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:60;max-width:760px;
  background:linear-gradient(180deg,#2a1608,#1a0f06);border:1px solid var(--amber);border-radius:11px;
  padding:13px 20px;box-shadow:0 22px 60px rgba(0,0,0,.7);animation:baja .5s;
}
@keyframes baja{from{opacity:0;transform:translate(-50%,-22px)}}
.flash-ev .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;color:var(--amber)}
.flash-ev .t{font-size:14px;font-weight:600;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(3,6,9,.86);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:640px;width:100%;max-height:86vh;overflow:auto}
.dlg h2{margin:0 0 4px;font-size:19px;letter-spacing:.05em}
.dlg h3{margin:20px 0 8px;font-size:11px;letter-spacing:.18em;color:var(--amber)}
.dlg p{color:var(--dim);font-size:13px}
.dlg input{width:100%;background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;margin-top:6px}
.veredicto{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.vcard{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:13px;background:#0a1016}
.vcard .n{font-family:var(--mono);font-size:31px;font-weight:700;color:var(--c)}
.vcard .l{font-size:9.5px;letter-spacing:.14em;color:var(--dim2)}
.vcard .sub{margin-top:8px;font-size:12px;color:var(--dim)}
table.rank{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.rank td,table.rank th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.rank th{font-size:9.5px;letter-spacing:.13em;color:var(--dim2);font-weight:400}
table.rank td.num{font-family:var(--mono);text-align:right}
/* el público activo (publico.js): termómetro, reacciones y preguntas de la tribuna */
.termo{padding:6px 12px 10px}
.termo-svg{width:100%;height:auto;display:block;background:#0a1016;border:1px solid var(--line);border-radius:10px}
.termo-pie{font-size:11px;color:var(--dim);margin-top:5px}
.msg .rx{display:flex;gap:8px;margin-top:4px;font-size:11.5px;color:var(--dim)}
.msg .rx span{background:#0a1016;border:1px solid var(--line);border-radius:99px;padding:0 7px}
.msg.mod.trib{border-color:var(--amber);background:#221c0c;--c:var(--amber)}
.rs-extra{display:flex;flex-direction:column;gap:6px;max-width:980px;font-size:16px;color:var(--txt);text-align:left;background:#0c131a;border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.rs-extra small{color:var(--dim)}
.in-inst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1100px;margin-top:18px}
.in-inst div{background:#0f161d;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.in-inst b{display:block;color:var(--amber);font-size:19px;margin-bottom:4px}
.in-inst span{color:var(--dim);font-size:15px}
.in-sub{color:var(--dim);font-size:19px;max-width:900px;margin-top:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1c2732;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div class="brand"><b>TRIBUNA</b><span id="semLbl">SEMANA 5</span></div>
  <div class="mocion">
    <div class="k">MOCIÓN EN DISPUTA</div>
    <div class="v" id="mocionTxt"></div>
  </div>
  <div class="ronda-pill" id="rondaPill">—</div>
  <div class="reloj mono" id="reloj">--:--</div>
</header>

<div class="marcador">
  <div class="eq" id="eqA" style="--c:var(--A)">
    <div class="flag" id="flagA"></div>
    <div class="id"><b id="nomA"></b><small id="lemaA"></small></div>
    <div class="cifra publico" title="Votos que ganó esta bancada en el público: los alumnos que no debaten y marcan su posición"><div class="n mono" id="publicoA">—</div><div class="l">PÚBLICO · votos</div></div>
    <div class="cifra rigor" title="Total del panel de jueces del debate (las tres notas del medio, sobre 30)"><div class="n mono" id="rigorA">—</div><div class="l">JUECES /30</div></div>
  </div>
  <div class="linea">
    <div class="lbl">EL VOTO · cuotas</div>
    <div class="cuotas"><span class="cuota" id="cuotaA" style="color:var(--A)">—</span><span class="cuota" id="cuotaB" style="color:var(--B)">—</span></div>
    <div class="barra-votos"><i id="vA" style="background:var(--A);width:50%"></i><i id="vN" style="background:#2c3a48;width:0%"></i><i id="vB" style="background:var(--B);width:50%"></i></div>
  </div>
  <div class="eq" id="eqB" style="--c:var(--B)">
    <div class="flag" id="flagB"></div>
    <div class="id"><b id="nomB"></b><small id="lemaB"></small></div>
    <div class="cifra publico" title="Votos que ganó esta bancada en el público: los alumnos que no debaten y marcan su posición"><div class="n mono" id="publicoB">—</div><div class="l">PÚBLICO · votos</div></div>
    <div class="cifra rigor" title="Total del panel de jueces del debate (las tres notas del medio, sobre 30)"><div class="n mono" id="rigorB">—</div><div class="l">JUECES /30</div></div>
  </div>
</div>

<main>
  <section class="col">
    <div class="cab">EL DEBATE <span class="pt" id="modoLbl"></span></div>
    <div class="pauta-bar" id="pauta"></div>
    <div class="participantes"><span class="pl" style="--c:var(--A)" id="listaA"></span><span class="pl" style="--c:var(--B)" id="listaB"></span></div>
    <div class="feed chat" id="feed"></div>
    <div class="escribiendo" id="escribiendo"></div>

    <div class="mesa">
      <div class="compositor">
        <div class="bancas"><button class="btn sm banca-t" id="chatBancaA" style="--c:var(--A)"></button><button class="btn sm banca-t" id="chatBancaB" style="--c:var(--B)"></button></div>
        <div class="sugiere" id="chatSugiere"></div>
        <textarea id="chatTx" rows="2" placeholder="Escribe por la bancada elegida (Enter envía). Para simular a varios alumnos: @Nombre: texto, un párrafo por alumno."></textarea>
        <button class="btn" id="chatEnviar">Enviar</button>
      </div>
      <div class="acciones">
        <button class="btn pri" id="btnPrincipal">ABRIR TRAMO</button>
        <button class="btn sm" id="btnModerar" title="La moderadora interviene ahora">🎙 MODERADORA</button>
        <button class="btn sm" id="btnMasMin" title="Alargar el tramo un minuto">+1 MIN</button>
        <button class="btn sm" id="btnMapa" title="La brújula de la clase a pantalla completa, con los puntos moviéndose en vivo" style="display:none">🧭 MAPA</button>
        <button class="btn sm" id="btnRepetir" title="Los alumnos responden la brújula otra vez; el proyector muestra cuánto se movió cada uno" style="display:none">🧭 REPETIR BRÚJULA</button>
        <button class="btn sm" id="btnTerminar" title="Terminar la clase y pasar al ranking final">🏁 TERMINAR CLASE</button>
        <button class="btn sm" id="btnEjemplo">✎ ejemplo</button>
        <span class="hint" id="hint"></span>
      </div>
    </div>
  </section>

  <aside class="col der">
    <div id="termoCaja" style="display:none">
      <div class="cab">🌡 EL PÚBLICO EN VIVO <span class="pt" id="termoPt"></span></div>
      <div class="termo" id="termo"></div>
    </div>
    <div class="cab">RANKING DE GRUPOS <span class="pt">promedio por debate</span></div>
    <div class="top3" id="top3"></div>
    <div class="cab">🔮 ORÁCULOS <span class="pt">quién predice mejor a los jueces</span></div>
    <div class="top3" id="oraculos"></div>
    <div class="cab">ÚLTIMO PANEL <span class="pt">las cinco tarjetas</span></div>
    <div class="up" id="ultimoPanel"></div>
  </aside>
</main>

<footer>
  <span style="letter-spacing:.16em;color:var(--dim)">SALA DE CONTROL</span>
  <select class="ev" id="selEvento"></select>
  <button class="btn sm" id="btnEvento">⚡ LANZAR</button>
  <div class="sep"></div>
  <button class="btn sm" id="btnCsv">↓ CSV</button>
  <button class="btn sm" id="btnIntro" title="Volver a mostrar la intro (tema, moción, posiciones)">📖 INTRO</button>
  <button class="btn sm" id="btnEscenario" title="El proyector sin botones: solo el debate, grande (Esc para volver)">⛶ ESCENARIO</button>
  <button class="btn sm" id="btnReset">⟲ REINICIAR</button>
  <button class="btn sm" id="btnLlm">⚙ MOTOR</button>
  <button class="btn sm" id="btnSonido" title="Sonidos al revelar">🔊</button>
  <div class="sep"></div>
  <div class="ticker" id="ticker"></div>
</footer>

<!-- el modo escenario (escenario.js): la vista del proyector sin botones -->
<div id="escenarioVista"></div>

<script src="contenido/sesiones.js?v=20260928a"></script>
<script>
  // La sesión se elige con ?semana=N (por defecto la primera del manifiesto). document.write
  // para que el archivo cargue de forma síncrona antes de app.js, que espera sus globales.
  (function () {
    const pedida = +new URLSearchParams(location.search).get("semana");
    const ok = SESIONES.some(x => x.semana === pedida) ? pedida : SESIONES[0].semana;
    document.write('<script src="contenido/semana' + ok + '.js?v=20260928a"><\/script>');
  })();
</script>
